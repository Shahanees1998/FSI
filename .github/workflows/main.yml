name: FSI Autobuild

on:
  push:
    branches:
      - main

jobs:
  create-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build
